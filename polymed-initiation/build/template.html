<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
:root{
  color-scheme: light;
  --page:#f3f4f3; --surface:#fcfcfb; --ink:#101314; --ink-2:#45494c; --muted:#6f7477;
  --rule:#e2e4e2; --rule-2:#c9cdcb; --accent:#1c5cab; --accent-ink:#184f95; --accent-soft:#ebf2fa;
  --warm-soft:#fbf2e8; --warm-rule:#ecd3b5; --good:#006300; --bad:#b3261e;
  --grid:#e1e0d9; --baseline:#c3c2b7; --chart-muted:#898781;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0c0d0d; --surface:#161717; --ink:#f1f2f2; --ink-2:#c3c6c7; --muted:#90959a;
    --rule:#2a2d2e; --rule-2:#3c4041; --accent:#6da7ec; --accent-ink:#86b6ef; --accent-soft:#142131;
    --warm-soft:#2a1f14; --warm-rule:#5a4127; --good:#0ca30c; --bad:#e66767;
    --grid:#2c2c2a; --baseline:#383835; --chart-muted:#898781;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0c0d0d; --surface:#161717; --ink:#f1f2f2; --ink-2:#c3c6c7; --muted:#90959a;
  --rule:#2a2d2e; --rule-2:#3c4041; --accent:#6da7ec; --accent-ink:#86b6ef; --accent-soft:#142131;
  --warm-soft:#2a1f14; --warm-rule:#5a4127; --good:#0ca30c; --bad:#e66767;
  --grid:#2c2c2a; --baseline:#383835; --chart-muted:#898781;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:16px}
body{margin:0; background:var(--page); color:var(--ink); font:15.5px/1.6 var(--font); padding-inline:16px;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
a{color:var(--accent-ink); text-decoration-thickness:1px; text-underline-offset:2px}
a:focus-visible, button:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.shell{display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; max-width:1260px; margin:0 auto; padding-block:24px 64px}
.toc{position:sticky; top:env(safe-area-inset-top,0px); align-self:start; max-height:100vh; overflow:auto; padding-block:8px 24px; font-size:13px; line-height:1.4}
.toc .brand{font-weight:650; font-size:14px; letter-spacing:.01em; margin:0 0 2px}
.toc .asof{color:var(--muted); font-size:12px; margin:0 0 10px}
.toc summary{cursor:pointer; font-weight:600; color:var(--ink-2); margin-bottom:8px; list-style:none}
.toc summary::-webkit-details-marker{display:none}
.toc ol{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.toc li a{display:block; color:var(--ink-2); text-decoration:none; padding:3px 8px; border-radius:5px}
.toc li.l1{margin-top:10px}
.toc li.l1 > a{font-weight:650; color:var(--ink); text-transform:uppercase; letter-spacing:.04em; font-size:11.5px}
.toc li.l2 > a{padding-left:14px}
.toc li a:hover{background:var(--accent-soft); color:var(--ink)}
.toc li a.active{color:var(--accent-ink); background:var(--accent-soft)}
.tools{display:flex; gap:8px; margin:0 0 12px}
.tools button{font:inherit; font-size:12px; color:var(--ink-2); background:transparent; border:1px solid var(--rule-2); border-radius:6px; padding:3px 8px; cursor:pointer}
.tools button:hover{background:var(--accent-soft)}
.doc{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:40px 52px 56px; min-width:0}
.cover{border-bottom:1px solid var(--rule-2); padding-bottom:22px; margin-bottom:8px}
.cover .kicker{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 6px}
.cover .ctitle{font-size:34px; line-height:1.15; font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
.cover .csub{font-size:18px; color:var(--ink-2); margin:6px 0 14px; text-wrap:balance}
.cover .meta{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--ink-2); margin:0}
.cover .meta b{color:var(--ink); font-weight:600}
.cover .scope{margin:14px 0 0; font-size:13px; color:var(--ink-2); max-width:80ch}
h1{font-size:27px; line-height:1.2; margin:64px 0 6px; padding-top:18px; border-top:2px solid var(--ink); text-wrap:balance; letter-spacing:-.005em}
h2{font-size:21.5px; line-height:1.25; margin:44px 0 10px; text-wrap:balance}
h3{font-size:17px; line-height:1.3; margin:28px 0 6px; text-wrap:balance}
h4{font-size:14.5px; margin:20px 0 4px; font-weight:650}
p, ul, ol, blockquote{max-width:76ch}
p{margin:0 0 12px}
ul, ol{padding-left:22px; margin:0 0 12px}
li{margin:2px 0}
strong{font-weight:650}
.n{border-bottom:1px dotted var(--rule-2); cursor:help; white-space:nowrap}
.n:hover{background:var(--accent-soft); border-bottom-color:var(--accent)}
figure.exh{margin:26px 0 30px; padding:0; max-width:100%}
figure.exh figcaption{font-weight:620; font-size:14.5px; line-height:1.35; margin:0 0 10px; max-width:88ch; text-wrap:balance}
.exn{color:var(--accent-ink); font-weight:700; margin-right:2px}
.plot{max-width:100%}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart text{font-family:var(--font)}
.chart .tick{fill:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.chart .cat{fill:var(--ink-2); font-size:12px}
.chart .unit{fill:var(--muted); font-size:11px}
.chart .val{fill:var(--ink); font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums}
.chart .inlbl{fill:#fff; font-size:11px; font-weight:600}
.chart .grid{stroke:var(--grid); stroke-width:1}
.chart .base{stroke:var(--baseline); stroke-width:1}
.chart .mark{transition:opacity .12s}
.chart .mark:hover{opacity:.78}
.legend{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12.5px; color:var(--ink-2); margin:0 0 6px}
.lg-item{display:inline-flex; align-items:center; gap:6px}
.note{font-size:12.5px; color:var(--ink-2); margin:8px 0 2px; max-width:92ch}
.src{font-size:12px; color:var(--muted); margin:6px 0 0; max-width:100ch}
details.tv{margin-top:6px; font-size:12.5px}
details.tv summary{cursor:pointer; color:var(--accent-ink); width:max-content}
.tw{overflow-x:auto; max-width:100%}
table.data{border-collapse:collapse; width:100%; font-size:13px; line-height:1.4; font-variant-numeric:tabular-nums; margin:4px 0}
table.data th, table.data td{padding:6px 9px; border-bottom:1px solid var(--rule); vertical-align:top; text-align:left}
table.data thead th{border-bottom:1px solid var(--rule-2); font-weight:620; color:var(--ink); background:transparent; position:relative}
table.data tbody th{font-weight:560; color:var(--ink)}
table.data td.num, table.data th.num{text-align:right; white-space:nowrap}
table.data tbody tr:hover td, table.data tbody tr:hover th{background:color-mix(in srgb, var(--accent-soft) 60%, transparent)}
table.bib td.url{word-break:break-all; font-size:12px}
.mono{font-family:var(--mono); font-size:12px}
aside.callout{border:1px solid var(--rule-2); background:var(--accent-soft); border-radius:6px; padding:14px 18px 6px; margin:18px 0 22px; max-width:86ch}
aside.callout.debate, aside.callout.risk{background:var(--warm-soft); border-color:var(--warm-rule)}
aside.callout .ct, section.snapshot .ct{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--ink-2); margin:0 0 6px}
aside.callout p, aside.callout ul{max-width:none}
section.snapshot{border:1px solid var(--rule-2); border-radius:6px; padding:14px 18px; margin:14px 0 22px}
section.snapshot dl{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:10px 22px; margin:0}
section.snapshot dt{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
section.snapshot dd{margin:1px 0 0; font-size:14px; line-height:1.4}
.kf{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px 22px; margin:18px 0 6px}
.kf div{border-top:1px solid var(--rule-2); padding-top:8px}
.kf .k{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.kf .v{font-size:19px; font-weight:650; line-height:1.25}
.kf .d{font-size:12.5px; color:var(--ink-2)}
.qblock{border-top:1px solid var(--rule); padding:10px 0 8px}
.qblock .q{font-weight:600}
.tag{display:inline-block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--rule-2); border-radius:3px; padding:0 5px; margin-right:6px; color:var(--ink-2); vertical-align:1px}
.tag.must{border-color:var(--accent); color:var(--accent-ink)}
#tip{position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--surface); font-size:12px; line-height:1.35; padding:6px 9px; border-radius:6px; max-width:320px; box-shadow:0 4px 18px rgba(0,0,0,.18)}
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr); gap:12px; padding-block:12px 40px}
  .toc{position:static; max-height:none; overflow:visible; padding:0}
  .doc{padding:26px 20px 40px}
}
@media (max-width:520px){
  body{font-size:15px}
  .cover .ctitle{font-size:28px}
  h1{font-size:23px} h2{font-size:19px}
  .doc{padding:20px 14px 32px; border-radius:0}
}
@media (prefers-reduced-motion:reduce){ .chart .mark{transition:none} }
@media print{
  :root{color-scheme:light}
  body{background:#fff; padding:0; font-size:10.5pt}
  .toc, .tools, #tip, details.tv{display:none !important}
  .shell{display:block; max-width:none; padding:0}
  .doc{border:0; padding:0; background:#fff}
  h1{break-before:page}
  figure.exh, aside.callout, section.snapshot, .qblock, table.data tr{break-inside:avoid}
  h1, h2, h3, figcaption{break-after:avoid}
  a{color:inherit; text-decoration:none}
  .n{border:0}
  body.companion .qblock::after{content:""; display:block; height:46px; border-bottom:1px solid #bbb}
}
</style>
</head>
<body class="{{BODYCLASS}}">
<div class="shell">
  <nav class="toc" aria-label="Contents">
    <p class="brand">{{TITLE}}</p>
    <p class="asof">Draft · as of {{AS_OF}}</p>
    <div class="tools"><button type="button" id="themeBtn" aria-label="Switch colour theme">Theme: system</button></div>
    <details id="tocd" open><summary>Contents</summary><ol>{{TOC}}</ol></details>
  </nav>
  <main class="doc" id="top">
{{BODY}}
  </main>
</div>
<div id="tip" role="tooltip" hidden></div>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  var modes=['system','light','dark'], cur='system';
  try{ cur=localStorage.getItem('pm-theme')||'system'; }catch(e){}
  function apply(m){ cur=m; if(m==='system'){root.removeAttribute('data-theme');} else {root.setAttribute('data-theme',m);} btn.textContent='Theme: '+m; try{localStorage.setItem('pm-theme',m);}catch(e){} }
  apply(cur);
  btn.addEventListener('click',function(){ apply(modes[(modes.indexOf(cur)+1)%3]); });
  if(window.matchMedia && window.matchMedia('(max-width:1100px)').matches){ var d=document.getElementById('tocd'); if(d) d.open=false; }
  var tip=document.getElementById('tip');
  function show(e,el){ tip.textContent=el.getAttribute('data-tip'); tip.hidden=false; move(e); }
  function move(e){ var x=e.clientX+14, y=e.clientY+14; var w=tip.offsetWidth, h=tip.offsetHeight;
    if(x+w>window.innerWidth-8) x=e.clientX-w-14; if(y+h>window.innerHeight-8) y=e.clientY-h-14; tip.style.left=x+'px'; tip.style.top=y+'px'; }
  document.addEventListener('pointerover',function(e){ var el=e.target.closest && e.target.closest('[data-tip]'); if(el) show(e,el); });
  document.addEventListener('pointermove',function(e){ if(!tip.hidden) move(e); });
  document.addEventListener('pointerout',function(e){ var el=e.target.closest && e.target.closest('[data-tip]'); if(el) tip.hidden=true; });
  var links=[].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  var map={}; links.forEach(function(a){ map[a.getAttribute('href').slice(1)]=a; });
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ links.forEach(function(a){a.classList.remove('active');}); var a=map[en.target.id]; if(a) a.classList.add('active'); } }); },{rootMargin:'0px 0px -75% 0px'});
    Object.keys(map).forEach(function(id){ var h=document.getElementById(id); if(h) io.observe(h); });
  }
})();
</script>
</body>
</html>
